name: vivienne_jump
description: "VIVIENNE : L'Odyssée Blossom v1.4.0 — Jeu d'ascension verticale Haute Couture en mode Portrait avec Menu d'Accueil Cartoon, Tableau Highscores dédié et Galerie Vivienne en Turntable 360° pilotée par l'inclinaison du téléphone."
publish_to: 'none'

version: 1.4.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

